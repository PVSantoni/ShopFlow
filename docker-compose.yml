services:
  php:
    build: ./docker/php
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/backend:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: db
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./docker/frontend
    command: ng serve --host 0.0.0.0 --poll 2000
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app/frontend
    
  worker:
    build: ./docker/php
    volumes:
      - ./backend:/var/www/backend
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M --sleep=1 -vv
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20


  # Projet Symfony séparé : consomme sa propre file (notifications) et envoie les emails.
  notification:
    build: ./docker/php
    working_dir: /var/www/notification
    volumes:
      - ./notification:/var/www/notification
    command: sh -c "composer install --no-interaction && php bin/console messenger:consume commandes --time-limit=3600 --memory-limit=128M --sleep=1 -vv"
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Boîte mail de dev : aucun email ne sort, interface sur http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"

volumes:
  db_data:
