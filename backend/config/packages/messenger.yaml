framework:
    messenger:
        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                serializer: App\Commande\Infrastructure\Messenger\JsonEventSerializer
        routing:
            'App\Commande\Domain\Event\CommandePassee': async

