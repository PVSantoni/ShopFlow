<article class="card">
  <div class="card__image" [style.--hue]="product().hue">
    <svg class="card__icon" [lucideIcon]="product().icon" [size]="72" [strokeWidth]="1.25" aria-hidden="true"></svg>
    @if (discount() > 0) {
      <app-badge class="card__badge">-{{ discount() }}%</app-badge>
    }
  </div>
  <div class="card__body">
    <h3 class="card__title">{{ product().title }}</h3>
    <app-rating [value]="product().rating" [count]="product().reviews" />
    <app-price [value]="product().price" [original]="product().originalPrice" />
    @if (product().badge) {
      <app-badge tone="dark">{{ product().badge }}</app-badge>
    }
    <button appButton variant="accent" size="sm" [block]="true" class="card__cta" type="button">Ajouter au panier</button>
  </div>
</article>
